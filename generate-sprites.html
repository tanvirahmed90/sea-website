<!DOCTYPE html>
<html>
<head>
  <title>Generate Tropical Angelfish Sprites</title>
</head>
<body style="background: #020812; color: #fff; font-family: sans-serif; padding: 2rem;">
  <h2>Generating Photographic Tropical Angelfish Sprites (Matching User Reference)...</h2>
  <div id="output" style="display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap;"></div>
  <div id="status" style="margin-top: 20px; font-family: monospace; color: #38bdf8;"></div>

  <script>
    function drawAngelfish(type) {
      const canvas = document.createElement('canvas');
      canvas.width = 220;
      canvas.height = 140;
      const ctx = canvas.getContext('2d');
      const cx = 110;
      const cy = 70;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Color Schemes based on user reference:
      // Type 1: Royal Cobalt Blue & Cyan with Yellow/Green fin crest (Front fish)
      // Type 2: Neon Magenta / Hot Pink & Coral with Yellow/Cyan face (Back fish)
      // Type 3: Electric Turquoise & Deep Violet with Gold trim
      // Type 4: Golden Sunburst & Orange with Royal Blue accents
      let bodyGrad, dorsalGrad, analGrad, tailColor, eyeRingColor, faceCyan, finTrim;

      if (type === 1) {
        // Royal Blue Angelfish (matches front fish)
        bodyGrad = ctx.createLinearGradient(cx + 40, cy, cx - 35, cy);
        bodyGrad.addColorStop(0, '#00d2ff'); // Cyan face
        bodyGrad.addColorStop(0.28, '#2b4bf2'); // Royal cobalt
        bodyGrad.addColorStop(0.65, '#5d29d6'); // Violet-purple mid
        bodyGrad.addColorStop(1, '#1b2a99'); // Deep blue peduncle

        dorsalGrad = ctx.createLinearGradient(cx + 10, cy - 55, cx - 20, cy - 20);
        dorsalGrad.addColorStop(0, '#ffe600'); // Yellow top
        dorsalGrad.addColorStop(0.35, '#2bd97c'); // Lime green
        dorsalGrad.addColorStop(0.7, '#00b4d8'); // Cyan
        dorsalGrad.addColorStop(1, '#3a0ca3'); // Violet base

        analGrad = ctx.createLinearGradient(cx + 5, cy + 55, cx - 20, cy + 20);
        analGrad.addColorStop(0, '#ffe600');
        analGrad.addColorStop(0.4, '#00f0ff');
        analGrad.addColorStop(1, '#240046');

        tailColor = 'rgba(0, 212, 255, 0.75)';
        eyeRingColor = '#ffb703';
        faceCyan = '#00f0ff';
        finTrim = '#ffe600';
      } else if (type === 2) {
        // Neon Magenta / Hot Pink Angelfish (matches back fish)
        bodyGrad = ctx.createLinearGradient(cx + 40, cy, cx - 35, cy);
        bodyGrad.addColorStop(0, '#ffbe0b'); // Yellow face
        bodyGrad.addColorStop(0.25, '#ff006e'); // Hot pink / magenta
        bodyGrad.addColorStop(0.7, '#8338ec'); // Purple-violet
        bodyGrad.addColorStop(1, '#3a0ca3');

        dorsalGrad = ctx.createLinearGradient(cx + 10, cy - 55, cx - 20, cy - 20);
        dorsalGrad.addColorStop(0, '#ffe600');
        dorsalGrad.addColorStop(0.3, '#ff007f');
        dorsalGrad.addColorStop(0.7, '#00f0ff');
        dorsalGrad.addColorStop(1, '#7209b7');

        analGrad = ctx.createLinearGradient(cx + 5, cy + 55, cx - 20, cy + 20);
        analGrad.addColorStop(0, '#ffe600');
        analGrad.addColorStop(0.4, '#ff006e');
        analGrad.addColorStop(1, '#3a0ca3');

        tailColor = 'rgba(255, 0, 128, 0.75)';
        eyeRingColor = '#ffe600';
        faceCyan = '#00f0ff';
        finTrim = '#00f0ff';
      } else if (type === 3) {
        // Electric Turquoise & Royal Indigo
        bodyGrad = ctx.createLinearGradient(cx + 40, cy, cx - 35, cy);
        bodyGrad.addColorStop(0, '#00f5d4');
        bodyGrad.addColorStop(0.3, '#00bbf9');
        bodyGrad.addColorStop(0.75, '#4361ee');
        bodyGrad.addColorStop(1, '#3f37c9');

        dorsalGrad = ctx.createLinearGradient(cx + 10, cy - 55, cx - 20, cy - 20);
        dorsalGrad.addColorStop(0, '#fee440');
        dorsalGrad.addColorStop(0.4, '#00f5d4');
        dorsalGrad.addColorStop(1, '#4361ee');

        analGrad = ctx.createLinearGradient(cx + 5, cy + 55, cx - 20, cy + 20);
        analGrad.addColorStop(0, '#fee440');
        analGrad.addColorStop(0.5, '#00bbf9');
        analGrad.addColorStop(1, '#3f37c9');

        tailColor = 'rgba(0, 245, 212, 0.75)';
        eyeRingColor = '#fee440';
        faceCyan = '#fee440';
        finTrim = '#fee440';
      } else {
        // Golden Sunburst & Fiery Coral
        bodyGrad = ctx.createLinearGradient(cx + 40, cy, cx - 35, cy);
        bodyGrad.addColorStop(0, '#00f0ff');
        bodyGrad.addColorStop(0.28, '#ff9e00');
        bodyGrad.addColorStop(0.7, '#ff5400');
        bodyGrad.addColorStop(1, '#9d0208');

        dorsalGrad = ctx.createLinearGradient(cx + 10, cy - 55, cx - 20, cy - 20);
        dorsalGrad.addColorStop(0, '#00f0ff');
        dorsalGrad.addColorStop(0.4, '#ffd000');
        dorsalGrad.addColorStop(1, '#ff5400');

        analGrad = ctx.createLinearGradient(cx + 5, cy + 55, cx - 20, cy + 20);
        analGrad.addColorStop(0, '#00f0ff');
        analGrad.addColorStop(0.4, '#ffd000');
        analGrad.addColorStop(1, '#d00000');

        tailColor = 'rgba(255, 180, 0, 0.75)';
        eyeRingColor = '#00f0ff';
        faceCyan = '#00f0ff';
        finTrim = '#ffd000';
      }

      // --- 1. Caudal (Tail) Fin (Left side) ---
      ctx.fillStyle = tailColor;
      ctx.beginPath();
      ctx.moveTo(cx - 32, cy);
      ctx.bezierCurveTo(cx - 55, cy - 18, cx - 72, cy - 22, cx - 85, cy - 20);
      ctx.bezierCurveTo(cx - 75, cy - 8, cx - 65, cy, cx - 75, cy + 8);
      ctx.bezierCurveTo(cx - 72, cy + 22, cx - 55, cy + 18, cx - 32, cy);
      ctx.closePath();
      ctx.fill();

      // Tail fin ray striations
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.lineWidth = 1;
      for (let r = -3; r <= 3; r++) {
        ctx.beginPath();
        ctx.moveTo(cx - 32, cy);
        ctx.quadraticCurveTo(cx - 55, cy + r * 4, cx - 80, cy + r * 6);
        ctx.stroke();
      }

      // --- 2. Sweeping Dorsal Sail Fin (Top) ---
      ctx.fillStyle = dorsalGrad;
      ctx.beginPath();
      ctx.moveTo(cx + 8, cy - 22); // Dorsal start
      ctx.bezierCurveTo(cx + 2, cy - 45, cx - 20, cy - 62, cx - 52, cy - 56); // Sweeping tip
      ctx.bezierCurveTo(cx - 42, cy - 42, cx - 36, cy - 30, cx - 32, cy - 10); // Attachment to peduncle
      ctx.quadraticCurveTo(cx - 15, cy - 20, cx + 8, cy - 22);
      ctx.closePath();
      ctx.fill();

      // Dorsal Fin Trim Line
      ctx.strokeStyle = finTrim;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(cx + 8, cy - 22);
      ctx.bezierCurveTo(cx + 2, cy - 45, cx - 20, cy - 62, cx - 52, cy - 56);
      ctx.stroke();

      // Dorsal Fin Rays
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.28)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 7; i++) {
        const startX = cx + 5 - i * 5;
        const startY = cy - 22 + i * 1.5;
        const endX = cx - 5 - i * 7;
        const endY = cy - 48 + i * 2;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(endX, endY);
        ctx.stroke();
      }

      // --- 3. Sweeping Ventral / Anal Sail Fin (Bottom) ---
      ctx.fillStyle = analGrad;
      ctx.beginPath();
      ctx.moveTo(cx + 12, cy + 22);
      ctx.bezierCurveTo(cx + 2, cy + 46, cx - 18, cy + 62, cx - 48, cy + 54); // Sweeping bottom tip
      ctx.bezierCurveTo(cx - 38, cy + 40, cx - 34, cy + 28, cx - 32, cy + 10);
      ctx.quadraticCurveTo(cx - 10, cy + 18, cx + 12, cy + 22);
      ctx.closePath();
      ctx.fill();

      // Anal Fin Trim
      ctx.strokeStyle = finTrim;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(cx + 12, cy + 22);
      ctx.bezierCurveTo(cx + 2, cy + 46, cx - 18, cy + 62, cx - 48, cy + 54);
      ctx.stroke();

      // --- 4. Main Disc Body ---
      ctx.fillStyle = bodyGrad;
      ctx.beginPath();
      ctx.moveTo(cx + 42, cy); // Snout
      ctx.bezierCurveTo(cx + 34, cy - 24, cx + 12, cy - 30, cx - 15, cy - 22); // Forehead to dorsal
      ctx.bezierCurveTo(cx - 28, cy - 16, cx - 35, cy - 8, cx - 38, cy); // Dorsal to peduncle
      ctx.bezierCurveTo(cx - 35, cy + 8, cx - 28, cy + 16, cx - 15, cy + 22); // Peduncle to belly
      ctx.bezierCurveTo(cx + 12, cy + 30, cx + 34, cy + 24, cx + 42, cy); // Belly to chin/snout
      ctx.closePath();
      ctx.fill();

      // Scale Pattern Texture (Curved fine striations)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
      ctx.lineWidth = 1;
      for (let c = -2; c <= 3; c++) {
        const sx = cx + c * 10;
        ctx.beginPath();
        ctx.arc(sx, cy, 26, -Math.PI * 0.35, Math.PI * 0.35);
        ctx.stroke();
      }

      // --- 5. Face Markings & Mask ---
      ctx.fillStyle = faceCyan;
      ctx.beginPath();
      ctx.moveTo(cx + 42, cy);
      ctx.bezierCurveTo(cx + 34, cy - 14, cx + 22, cy - 18, cx + 18, cy - 8);
      ctx.bezierCurveTo(cx + 20, cy + 4, cx + 28, cy + 14, cx + 42, cy);
      ctx.globalAlpha = 0.45;
      ctx.fill();
      ctx.globalAlpha = 1.0;

      // Snout highlight
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(cx + 40, cy, 2.5, 3.5, 0, 0, Math.PI * 2);
      ctx.fill();

      // --- 6. Large Expressive Eye (Matches reference photo) ---
      const eyeX = cx + 25;
      const eyeY = cy - 5;
      // Outer rim
      ctx.beginPath();
      ctx.arc(eyeX, eyeY, 6.5, 0, Math.PI * 2);
      ctx.fillStyle = eyeRingColor;
      ctx.fill();

      // Inner iris
      ctx.beginPath();
      ctx.arc(eyeX, eyeY, 4.8, 0, Math.PI * 2);
      ctx.fillStyle = '#ff7b00';
      ctx.fill();

      // Deep Pupil
      ctx.beginPath();
      ctx.arc(eyeX, eyeY, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = '#020611';
      ctx.fill();

      // Specular Corneal Highlights (Glint)
      ctx.beginPath();
      ctx.arc(eyeX + 1.5, eyeY - 1.5, 1.6, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(eyeX - 1.2, eyeY + 1.2, 0.8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.fill();

      // --- 7. Translucent Pectoral Fin (Near side) ---
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.beginPath();
      ctx.moveTo(cx + 14, cy + 4);
      ctx.bezierCurveTo(cx + 4, cy + 18, cx - 6, cy + 24, cx - 18, cy + 18);
      ctx.quadraticCurveTo(cx - 2, cy + 10, cx + 14, cy + 4);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.lineWidth = 1;
      ctx.stroke();

      return canvas;
    }

    async function run() {
      const output = document.getElementById('output');
      const status = document.getElementById('status');

      for (let i = 1; i <= 4; i++) {
        const cvs = drawAngelfish(i);
        output.appendChild(cvs);
        const dataUrl = cvs.toDataURL('image/png');

        try {
          const res = await fetch('/api/save-fish', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              filename: `fish-${i}.png`,
              base64: dataUrl
            })
          });
          const result = await res.json();
          status.innerHTML += `Saved Angelfish fish-${i}.png successfully.<br/>`;
        } catch (err) {
          status.innerHTML += `Error saving fish-${i}.png: ${err.message}<br/>`;
        }
      }
      status.innerHTML += `<strong>4 Vibrant Tropical Angelfish sprites generated and saved!</strong>`;
    }

    run();
  </script>
</body>
</html>
